name: CodeQL (With Sibling)
# Reusable CodeQL workflow for Go repos that have a replace directive pointing
# to a sibling borch-ai repo (e.g. pithos → powerword). Both repos are checked
# out into parallel directories so the replace directive resolves correctly
# before the CodeQL manual build runs.
#
# Usage in caller:
#   jobs:
#     analyze-go:
#       uses: borch-ai/.github/.github/workflows/codeql-with-sibling.yml@main
#       secrets: inherit
#       with:
#         sibling-repo: borch-ai/powerword
#         sibling-path: powerword
#         repo-path: pithos

on:
  workflow_call:
    inputs:
      sibling-repo:
        description: "Full name of the sibling repo to check out (e.g. borch-ai/powerword)"
        type: string
        required: true
      sibling-path:
        description: "Local path to check out the sibling repo into (e.g. powerword)"
        type: string
        required: true
      repo-path:
        description: "Local path to check out this repo into (e.g. pithos)"
        type: string
        required: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ inputs.repo-path }}

      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout sibling (${{ inputs.sibling-repo }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.sibling-repo }}
          path: ${{ inputs.sibling-path }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.repo-path }}/go.mod
          cache: true
          cache-dependency-path: |
            ${{ inputs.repo-path }}/go.sum
            ${{ inputs.sibling-path }}/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: go
          build-mode: manual

      - name: Build
        working-directory: ${{ inputs.repo-path }}
        run: make build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:go"
