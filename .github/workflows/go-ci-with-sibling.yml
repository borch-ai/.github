name: Go CI (With Sibling)
# Reusable workflow for Go repos that have a replace directive pointing to a
# sibling borch-ai repo (e.g. pithos → powerword). Both repos are checked out
# into parallel directories so the replace directive resolves correctly.
#
# Usage in caller:
#   jobs:
#     ci:
#       uses: borch-ai/.github/.github/workflows/go-ci-with-sibling.yml@main
#       secrets: inherit
#       with:
#         sibling-repo: borch-ai/powerword
#         sibling-path: powerword

on:
  workflow_call:
    inputs:
      sibling-repo:
        description: "Full name of the sibling repo to check out (e.g. borch-ai/powerword)"
        type: string
        required: true
      sibling-path:
        description: "Local path to check out the sibling repo into (e.g. powerword)"
        type: string
        required: true
      repo-path:
        description: "Local path to check out this repo into (default: name of calling repo)"
        type: string
        required: true
      coverage-threshold:
        description: "Minimum unit test coverage percentage (default: 91)"
        type: number
        default: 91
      build-runner:
        description: "Build runner to use: auto, make, or task (default: auto)"
        type: string
        default: "auto"
      task-version:
        description: "Pinned Task CLI version to install when Task is needed (default: 3.54.0)"
        type: string
        default: "3.54.0"

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ inputs.repo-path }}
          fetch-depth: 0

      - name: Move Git Directory to Root for Gitleaks
        run: |
          if [ "${{ inputs.repo-path }}" != "." ]; then
            mv ${{ inputs.repo-path }}/.git .git
          fi

      - name: Run Gitleaks
        if: github.actor != 'dependabot[bot]'
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          source: ${{ inputs.repo-path }}

      - name: Move Git Directory back to Repo Path
        if: always()
        run: |
          if [ "${{ inputs.repo-path }}" != "." ]; then
            mv .git ${{ inputs.repo-path }}/.git
          fi

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ${{ inputs.repo-path }}
          ignore_paths: node_modules

      - name: Check for Dockerfile
        id: check_dockerfile
        run: |
          if [ -f "${{ inputs.repo-path }}/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Hadolint
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ inputs.repo-path }}/Dockerfile

      - name: Run Yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3
        with:
          file_or_dir: ${{ inputs.repo-path }}
          config_data: |
            extends: default
            rules:
              line-length: disable
              document-start: disable
              truthy: disable
              brackets: disable
              comments: disable

      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Sibling (${{ inputs.sibling-repo }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.sibling-repo }}
          path: ${{ inputs.sibling-path }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.repo-path }}/go.mod
          cache: true
          cache-dependency-path: |
            ${{ inputs.repo-path }}/go.sum
            ${{ inputs.sibling-path }}/go.sum

      - name: Install powerword
        run: |
          cd ${{ inputs.sibling-path }}
          go install ./cmd/powerword

      - name: Check for Taskfile
        id: check-taskfile
        working-directory: ${{ inputs.repo-path }}
        env:
          BUILD_RUNNER: ${{ inputs.build-runner }}
        run: |
          case "$BUILD_RUNNER" in
            auto|make|task) ;;
            *)
              echo "::error::Invalid build-runner '$BUILD_RUNNER' (must be auto, make, or task)"
              exit 1
              ;;
          esac
          TASKFILE_NAME=""
          for name in Taskfile.yml taskfile.yml Taskfile.yaml taskfile.yaml Taskfile.dist.yml taskfile.dist.yml Taskfile.dist.yaml taskfile.dist.yaml; do
            if [ -f "$name" ]; then
              TASKFILE_NAME="$name"
              break
            fi
          done
          echo "taskfile=$TASKFILE_NAME" >> "$GITHUB_OUTPUT"
          if [ "$BUILD_RUNNER" = "task" ] || { [ "$BUILD_RUNNER" = "auto" ] && [ -n "$TASKFILE_NAME" ]; }; then
            echo "install-task=true" >> "$GITHUB_OUTPUT"
          else
            echo "install-task=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Task
        if: steps.check-taskfile.outputs.install-task == 'true'
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: ${{ inputs.task-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect build runner
        id: detect
        working-directory: ${{ inputs.repo-path }}
        env:
          BUILD_RUNNER: ${{ inputs.build-runner }}
          TASKFILE_NAME: ${{ steps.check-taskfile.outputs.taskfile }}
          REQUIRED_TASKS: "all lint tidy vuln check-coverage build"
        run: |
          if [ "$BUILD_RUNNER" = "make" ]; then
            echo "runner=make" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$BUILD_RUNNER" = "task" ]; then
            if [ -z "$TASKFILE_NAME" ] || [ ! -f "$TASKFILE_NAME" ]; then
              echo "::error::build-runner is set to 'task', but no Taskfile was found in $(pwd)"
              exit 1
            fi
            TASK_ERR_FILE=$(mktemp)
            if ! TASK_JSON=$(task --list-all --json 2>"$TASK_ERR_FILE"); then
              TASK_ERR=$(tr '\n' ' ' < "$TASK_ERR_FILE")
              rm -f "$TASK_ERR_FILE"
              echo "::error::Failed to evaluate $TASKFILE_NAME with 'task --list-all --json' (remote includes in unattended CI must pin 'checksum:'): $TASK_ERR"
              exit 1
            fi
            rm -f "$TASK_ERR_FILE"
            if ! printf '%s\n' "$TASK_JSON" | jq -r '.tasks[]?.name // empty' >/dev/null 2>&1; then
              echo "::error::Failed to parse JSON output from 'task --list-all --json' for $TASKFILE_NAME"
              exit 1
            fi
            echo "runner=task" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$TASKFILE_NAME" ] || [ ! -f "$TASKFILE_NAME" ]; then
            echo "runner=make" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TASK_ERR_FILE=$(mktemp)
          if ! TASK_JSON=$(task --list-all --json 2>"$TASK_ERR_FILE"); then
            TASK_ERR=$(tr '\n' ' ' < "$TASK_ERR_FILE")
            rm -f "$TASK_ERR_FILE"
            echo "::error::Failed to evaluate $TASKFILE_NAME with 'task --list-all --json' (remote includes in unattended CI must pin 'checksum:'): $TASK_ERR"
            exit 1
          fi
          rm -f "$TASK_ERR_FILE"
          if ! AVAILABLE_TASKS=$(printf '%s\n' "$TASK_JSON" | jq -r '.tasks[]?.name // empty' 2>/dev/null); then
            echo "::error::Failed to parse JSON output from 'task --list-all --json' for $TASKFILE_NAME"
            exit 1
          fi
          MISSING=""
          for req in $REQUIRED_TASKS; do
            if ! printf '%s\n' "$AVAILABLE_TASKS" | grep -Fxq "$req"; then
              if [ -z "$MISSING" ]; then
                MISSING="$req"
              else
                MISSING="$MISSING, $req"
              fi
            fi
          done
          if [ -z "$MISSING" ]; then
            echo "runner=task" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f "Makefile" ] || [ -f "makefile" ] || [ -f "GNUmakefile" ]; then
            echo "::warning::$TASKFILE_NAME found but missing required contract task(s) ($MISSING); falling back to Makefile"
            echo "runner=make" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::$TASKFILE_NAME found but missing required contract task(s) ($MISSING) and no Makefile present"
          exit 1

      - name: Run Linter
        working-directory: ${{ inputs.repo-path }}
        run: ${{ steps.detect.outputs.runner }} lint

  security-and-test:
    name: Security & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ inputs.repo-path }}

      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Sibling (${{ inputs.sibling-repo }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.sibling-repo }}
          path: ${{ inputs.sibling-path }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.repo-path }}/go.mod
          cache: true
          cache-dependency-path: |
            ${{ inputs.repo-path }}/go.sum
            ${{ inputs.sibling-path }}/go.sum

      - name: Install powerword
        run: |
          cd ${{ inputs.sibling-path }}
          go install ./cmd/powerword

      - name: Check for Taskfile
        id: check-taskfile
        working-directory: ${{ inputs.repo-path }}
        env:
          BUILD_RUNNER: ${{ inputs.build-runner }}
        run: |
          case "$BUILD_RUNNER" in
            auto|make|task) ;;
            *)
              echo "::error::Invalid build-runner '$BUILD_RUNNER' (must be auto, make, or task)"
              exit 1
              ;;
          esac
          TASKFILE_NAME=""
          for name in Taskfile.yml taskfile.yml Taskfile.yaml taskfile.yaml Taskfile.dist.yml taskfile.dist.yml Taskfile.dist.yaml taskfile.dist.yaml; do
            if [ -f "$name" ]; then
              TASKFILE_NAME="$name"
              break
            fi
          done
          echo "taskfile=$TASKFILE_NAME" >> "$GITHUB_OUTPUT"
          if [ "$BUILD_RUNNER" = "task" ] || { [ "$BUILD_RUNNER" = "auto" ] && [ -n "$TASKFILE_NAME" ]; }; then
            echo "install-task=true" >> "$GITHUB_OUTPUT"
          else
            echo "install-task=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Task
        if: steps.check-taskfile.outputs.install-task == 'true'
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: ${{ inputs.task-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect build runner
        id: detect
        working-directory: ${{ inputs.repo-path }}
        env:
          BUILD_RUNNER: ${{ inputs.build-runner }}
          TASKFILE_NAME: ${{ steps.check-taskfile.outputs.taskfile }}
          REQUIRED_TASKS: "all lint tidy vuln check-coverage build"
        run: |
          if [ "$BUILD_RUNNER" = "make" ]; then
            echo "runner=make" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$BUILD_RUNNER" = "task" ]; then
            if [ -z "$TASKFILE_NAME" ] || [ ! -f "$TASKFILE_NAME" ]; then
              echo "::error::build-runner is set to 'task', but no Taskfile was found in $(pwd)"
              exit 1
            fi
            TASK_ERR_FILE=$(mktemp)
            if ! TASK_JSON=$(task --list-all --json 2>"$TASK_ERR_FILE"); then
              TASK_ERR=$(tr '\n' ' ' < "$TASK_ERR_FILE")
              rm -f "$TASK_ERR_FILE"
              echo "::error::Failed to evaluate $TASKFILE_NAME with 'task --list-all --json' (remote includes in unattended CI must pin 'checksum:'): $TASK_ERR"
              exit 1
            fi
            rm -f "$TASK_ERR_FILE"
            if ! printf '%s\n' "$TASK_JSON" | jq -r '.tasks[]?.name // empty' >/dev/null 2>&1; then
              echo "::error::Failed to parse JSON output from 'task --list-all --json' for $TASKFILE_NAME"
              exit 1
            fi
            echo "runner=task" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$TASKFILE_NAME" ] || [ ! -f "$TASKFILE_NAME" ]; then
            echo "runner=make" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TASK_ERR_FILE=$(mktemp)
          if ! TASK_JSON=$(task --list-all --json 2>"$TASK_ERR_FILE"); then
            TASK_ERR=$(tr '\n' ' ' < "$TASK_ERR_FILE")
            rm -f "$TASK_ERR_FILE"
            echo "::error::Failed to evaluate $TASKFILE_NAME with 'task --list-all --json' (remote includes in unattended CI must pin 'checksum:'): $TASK_ERR"
            exit 1
          fi
          rm -f "$TASK_ERR_FILE"
          if ! AVAILABLE_TASKS=$(printf '%s\n' "$TASK_JSON" | jq -r '.tasks[]?.name // empty' 2>/dev/null); then
            echo "::error::Failed to parse JSON output from 'task --list-all --json' for $TASKFILE_NAME"
            exit 1
          fi
          MISSING=""
          for req in $REQUIRED_TASKS; do
            if ! printf '%s\n' "$AVAILABLE_TASKS" | grep -Fxq "$req"; then
              if [ -z "$MISSING" ]; then
                MISSING="$req"
              else
                MISSING="$MISSING, $req"
              fi
            fi
          done
          if [ -z "$MISSING" ]; then
            echo "runner=task" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f "Makefile" ] || [ -f "makefile" ] || [ -f "GNUmakefile" ]; then
            echo "::warning::$TASKFILE_NAME found but missing required contract task(s) ($MISSING); falling back to Makefile"
            echo "runner=make" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::$TASKFILE_NAME found but missing required contract task(s) ($MISSING) and no Makefile present"
          exit 1

      - name: Check Dependency Tidy Hygiene
        working-directory: ${{ inputs.repo-path }}
        run: ${{ steps.detect.outputs.runner }} tidy && git diff --exit-code go.mod go.sum

      - name: Run Vulnerability Scan
        working-directory: ${{ inputs.repo-path }}
        run: ${{ steps.detect.outputs.runner }} vuln

      - name: Run Tests & Check Coverage
        working-directory: ${{ inputs.repo-path }}
        env:
          MIN_COVERAGE: ${{ inputs.coverage-threshold }}
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          if [ "${{ steps.detect.outputs.runner }}" = "make" ]; then
            make check-coverage "MIN_COVERAGE=${MIN_COVERAGE}" "COVERAGE_THRESHOLD=${COVERAGE_THRESHOLD}"
          else
            ${{ steps.detect.outputs.runner }} check-coverage
          fi

      - name: Compile Binary
        working-directory: ${{ inputs.repo-path }}
        run: ${{ steps.detect.outputs.runner }} build
