name: Daedalus Ecosystem Scan

on:
  workflow_call:
    inputs:
      scan_level:
        description: 'Level of scan (basic, deep)'
        required: false
        default: 'basic'
        type: string
      go-version:
        description: 'Go version to use for running Daedalus'
        required: false
        default: '1.26.x'
        type: string

permissions:
  contents: read

jobs:
  analyze:
    name: Run Daedalus Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: Install Daedalus
        run: go install github.com/borch-ai/daedalus/cmd/daedalus@latest

      - name: Execute Daedalus Scan
        run: daedalus scan --level ${{ inputs.scan_level }} --report-only

      - name: Upload Health Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ecosystem-health-report
          path: daedalus-report.md
