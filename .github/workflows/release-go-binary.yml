name: Release Go Binary

on:
  workflow_call:
    inputs:
      binary-name:
        description: "Name of the binary to build"
        type: string
        required: true
      sibling-repo:
        description: "Full name of the sibling repo to check out (e.g. borch-ai/powerword)"
        type: string
        required: false
      sibling-path:
        description: "Local path to check out the sibling repo into (e.g. powerword)"
        type: string
        required: false
        default: "sibling"
      repo-path:
        description: "Local path to check out this repo into (default: .)"
        type: string
        required: false
        default: "."
      coverage-threshold:
        description: "Minimum unit test coverage percentage (default: 91)"
        type: number
        required: false
        default: 91
      build-runner:
        description: "Build runner to use: auto, make, or task (default: auto)"
        type: string
        required: false
        default: "auto"
      task-version:
        description: "Pinned Task CLI version to install when Task is needed (default: 3.54.0)"
        type: string
        required: false
        default: "3.54.0"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    env:
      CI_APP_ID: ${{ secrets.CI_APP_ID }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ inputs.repo-path }}
          fetch-depth: 0

      - name: Generate GitHub App Token
        if: inputs.sibling-repo != '' || env.CI_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Sibling (${{ inputs.sibling-repo }})
        if: inputs.sibling-repo != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.sibling-repo }}
          path: ${{ inputs.sibling-path }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Create Sibling Symlink
        if: inputs.sibling-repo != '' && inputs.repo-path == '.'
        run: ln -s "$GITHUB_WORKSPACE/${{ inputs.sibling-path }}" "$GITHUB_WORKSPACE/../${{ inputs.sibling-path }}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.repo-path }}/go.mod
          cache: true

      - name: Install Sibling CLI
        if: inputs.sibling-repo != ''
        run: |
          cd ${{ inputs.sibling-path }}
          go install ./cmd/...

      - name: Configure Git for Private Modules
        if: inputs.sibling-repo == '' && env.CI_APP_ID != ''
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Install powerword
        if: inputs.sibling-repo == '' && env.CI_APP_ID != ''
        run: GOPRIVATE="github.com/borch-ai/*" go install github.com/borch-ai/powerword/cmd/powerword@latest

      - name: Check for Taskfile
        id: check-taskfile
        working-directory: ${{ inputs.repo-path }}
        env:
          BUILD_RUNNER: ${{ inputs.build-runner }}
        run: |
          case "$BUILD_RUNNER" in
            auto|make|task) ;;
            *)
              echo "::error::Invalid build-runner '$BUILD_RUNNER' (must be auto, make, or task)"
              exit 1
              ;;
          esac
          TASKFILE_NAME=""
          for name in Taskfile.yml taskfile.yml Taskfile.yaml taskfile.yaml Taskfile.dist.yml taskfile.dist.yml Taskfile.dist.yaml taskfile.dist.yaml; do
            if [ -f "$name" ]; then
              TASKFILE_NAME="$name"
              break
            fi
          done
          echo "taskfile=$TASKFILE_NAME" >> "$GITHUB_OUTPUT"
          if [ "$BUILD_RUNNER" = "task" ] || { [ "$BUILD_RUNNER" = "auto" ] && [ -n "$TASKFILE_NAME" ]; }; then
            echo "install-task=true" >> "$GITHUB_OUTPUT"
          else
            echo "install-task=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Task
        if: steps.check-taskfile.outputs.install-task == 'true'
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: ${{ inputs.task-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect build runner
        id: detect
        working-directory: ${{ inputs.repo-path }}
        env:
          BUILD_RUNNER: ${{ inputs.build-runner }}
          TASKFILE_NAME: ${{ steps.check-taskfile.outputs.taskfile }}
          REQUIRED_TASKS: "all lint tidy vuln check-coverage build"
        run: |
          if [ "$BUILD_RUNNER" = "make" ]; then
            echo "runner=make" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$BUILD_RUNNER" = "task" ]; then
            if [ -z "$TASKFILE_NAME" ] || [ ! -f "$TASKFILE_NAME" ]; then
              echo "::error::build-runner is set to 'task', but no Taskfile was found in $(pwd)"
              exit 1
            fi
            echo "runner=task" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$TASKFILE_NAME" ] || [ ! -f "$TASKFILE_NAME" ]; then
            echo "runner=make" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AVAILABLE_TASKS=""
          if TASK_JSON=$(task --list-all --json 2>/dev/null); then
            AVAILABLE_TASKS=$(printf '%s\n' "$TASK_JSON" | jq -r '.tasks[]?.name // empty' 2>/dev/null || true)
          fi
          MISSING=""
          for req in $REQUIRED_TASKS; do
            if ! printf '%s\n' "$AVAILABLE_TASKS" | grep -Fxq "$req"; then
              if [ -z "$MISSING" ]; then
                MISSING="$req"
              else
                MISSING="$MISSING, $req"
              fi
            fi
          done
          if [ -z "$MISSING" ]; then
            echo "runner=task" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f "Makefile" ] || [ -f "makefile" ] || [ -f "GNUmakefile" ]; then
            echo "::warning::$TASKFILE_NAME found but missing required contract task(s) ($MISSING); falling back to Makefile"
            echo "runner=make" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::$TASKFILE_NAME found but missing required contract task(s) ($MISSING) and no Makefile present"
          exit 1

      - name: Run Linter
        working-directory: ${{ inputs.repo-path }}
        run: ${{ steps.detect.outputs.runner }} lint

      - name: Check Dependency Tidy Hygiene
        working-directory: ${{ inputs.repo-path }}
        run: |
          ${{ steps.detect.outputs.runner }} tidy
          git diff --exit-code go.mod go.sum

      - name: Run Vulnerability Scan
        working-directory: ${{ inputs.repo-path }}
        run: ${{ steps.detect.outputs.runner }} vuln

      - name: Run Tests & Check Coverage
        working-directory: ${{ inputs.repo-path }}
        env:
          MIN_COVERAGE: ${{ inputs.coverage-threshold }}
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          if [ "${{ steps.detect.outputs.runner }}" = "make" ]; then
            make check-coverage "MIN_COVERAGE=${MIN_COVERAGE}" "COVERAGE_THRESHOLD=${COVERAGE_THRESHOLD}"
          else
            ${{ steps.detect.outputs.runner }} check-coverage
          fi

      - name: Run Semantic Release
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f # v1.24.1
        id: semrel
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ${{ inputs.repo-path }}

      - name: Build Binaries
        if: steps.semrel.outputs.version != ''
        working-directory: ${{ inputs.repo-path }}
        env:
          VERSION: ${{ steps.semrel.outputs.version }}
          BINARY_NAME: ${{ inputs.binary-name }}
        run: |
          mkdir -p dist
          VERSION_NUM="${VERSION#v}"
          VERSION_TAG="v${VERSION_NUM}"
          echo "Building version ${VERSION_TAG}..."
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X github.com/${{ github.repository }}/internal/config.Version=${VERSION_TAG}" -o "dist/${BINARY_NAME}-darwin-amd64" "./cmd/${BINARY_NAME}"
          GOOS=darwin GOARCH=arm64 go build -ldflags "-X github.com/${{ github.repository }}/internal/config.Version=${VERSION_TAG}" -o "dist/${BINARY_NAME}-darwin-arm64" "./cmd/${BINARY_NAME}"
          GOOS=linux GOARCH=amd64 go build -ldflags "-X github.com/${{ github.repository }}/internal/config.Version=${VERSION_TAG}" -o "dist/${BINARY_NAME}-linux-amd64" "./cmd/${BINARY_NAME}"
          GOOS=linux GOARCH=arm64 go build -ldflags "-X github.com/${{ github.repository }}/internal/config.Version=${VERSION_TAG}" -o "dist/${BINARY_NAME}-linux-arm64" "./cmd/${BINARY_NAME}"
          GOOS=windows GOARCH=amd64 go build -ldflags "-X github.com/${{ github.repository }}/internal/config.Version=${VERSION_TAG}" -o "dist/${BINARY_NAME}-windows-amd64.exe" "./cmd/${BINARY_NAME}"

      - name: Upload Binaries to GitHub Release
        if: steps.semrel.outputs.version != ''
        working-directory: ${{ inputs.repo-path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.semrel.outputs.version }}
        run: |
          VERSION_NUM="${VERSION#v}"
          VERSION_TAG="v${VERSION_NUM}"
          gh release upload "$VERSION_TAG" dist/* --clobber
