name: CI Self-Test
# Validates the workflows and scripts in this repository itself.
# Runs yamllint over all workflow files and actionlint to catch structural errors.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'taskfiles/**'
      - 'tests/**'
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  lint-workflows:
    name: Lint Workflow and Taskfile YAML
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3
        with:
          file_or_dir: .
          config_data: |
            extends: default
            rules:
              line-length: disable
              document-start: disable
              truthy: disable
              brackets: disable
              comments: disable

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.7

  test-taskfiles:
    name: Test Shared Taskfiles
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'
          cache: false

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Standard Fixture
        run: |
          cd tests/taskfiles/go-fixture
          task all
          test -x bin/sample
          test -f coverage.out
          test -f bin/.sample.config
          grep -q "VERSION=dev" bin/.sample.config

          # Verify up-to-date detection on unchanged build (no compile commands run)
          BUILD_OUT=$(task build)
          test -z "$BUILD_OUT"

          # Verify rebuild on VERSION configuration change
          task build VERSION=v1.0.0
          grep -q "VERSION=v1.0.0" bin/.sample.config

          # Verify rebuild on configuration restore
          task build
          grep -q "VERSION=dev" bin/.sample.config

          task clean
          test ! -d bin
          test ! -f coverage.out

      - name: Verify Override Fixture
        run: |
          cd tests/taskfiles/go-override-fixture
          task all
          test -x bin/sample
          test -f bin/custom-build-executed.txt
          test -f bin/custom-lint-executed.txt
          grep -q "custom-build-executed" bin/custom-build-executed.txt
          grep -q "custom-lint-executed" bin/custom-lint-executed.txt
          task clean
          test ! -d bin
          test ! -f coverage.out

  pr-title:
    name: Validate PR Title
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-title.yml

  pr-description:
    name: Validate PR Description
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    uses: ./.github/workflows/pr-description.yml

  markdown-lint:
    name: Lint Markdown Files
    uses: ./.github/workflows/markdown-lint.yml

  markdown-link-check:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links
        uses: gaurav-nelson/github-action-markdown-link-check@3c3b66f1f7d0900e37b71eca45b63ea9eedfce31 # v1.0.17
        with:
          use-quiet-mode: 'yes'

  gitleaks:
    name: Scan Secrets
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  budget-auditor:
    name: Audit Token Budget
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/powerword-budget-auditor.yml
    secrets: inherit
    permissions:
      pull-requests: write
      issues: write
      contents: read
    with:
      pr-number: ${{ github.event.pull_request.number }}
