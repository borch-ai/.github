name: Validate PR Title
# Reusable workflow for enforcing Conventional Commits PR title format.
# Usage in caller:
#   jobs:
#     pr-title:
#       uses: borch-ai/.github/.github/workflows/pr-title.yml@main
#       secrets: inherit

on:
  workflow_call:

permissions:
  statuses: write
  pull-requests: read

jobs:
  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Semantic PR Check
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
