name: Setup and Detect Build Runner
description: "Detects whether to use Make or Task based on Contract v1 rules and conditionally installs Task."

inputs:
  build-runner:
    description: "Build runner mode: auto, make, or task"
    required: false
    default: "auto"
  task-version:
    description: "Pinned Task CLI version to install when Task is needed"
    required: false
    default: "3.54.0"
  required-tasks:
    description: "Space-separated list of required contract tasks for auto-detection"
    required: false
    default: "all lint tidy vuln check-coverage build"
  working-directory:
    description: "Directory containing the repository checkout to inspect"
    required: false
    default: "."

outputs:
  runner:
    description: "Selected build runner binary (make or task)"
    value: ${{ steps.detect.outputs.runner }}

runs:
  using: "composite"
  steps:
    - name: Check for Taskfile
      id: check-taskfile
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BUILD_RUNNER: ${{ inputs.build-runner }}
      run: '"$GITHUB_ACTION_PATH/check-taskfile.sh"'

    - name: Install Task
      if: steps.check-taskfile.outputs.install-task == 'true'
      uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
      with:
        version: ${{ inputs.task-version }}
        repo-token: ${{ github.token }}

    - name: Detect build runner
      id: detect
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BUILD_RUNNER: ${{ inputs.build-runner }}
        TASKFILE_NAME: ${{ steps.check-taskfile.outputs.taskfile }}
        REQUIRED_TASKS: ${{ inputs.required-tasks }}
      run: '"$GITHUB_ACTION_PATH/detect-runner.sh"'
