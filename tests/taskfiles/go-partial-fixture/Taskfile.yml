# https://taskfile.dev
# Stage 1 partial migration fixture (intentionally omits `all` and `check-coverage`)
version: '3'

vars:
  POWERWORD: '{{.POWERWORD | default "../mock-powerword.sh"}}'

includes:
  org:
    taskfile: ../../../taskfiles/go.yml
    vars:
      POWERWORD: '{{.POWERWORD}}'

tasks:
  build:
    desc: Build binaries
    cmds:
      - task: org:build

  test:
    desc: Run tests
    cmds:
      - task: org:test

  lint:
    desc: Run linter
    cmds:
      - task: org:lint

  tidy:
    desc: Tidy dependencies
    cmds:
      - task: org:tidy

  vuln:
    desc: Vulnerability scan
    cmds:
      - task: org:vuln

  clean:
    desc: Clean build outputs
    cmds:
      - task: org:clean
